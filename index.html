<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFE4EA"><link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Caderno de Receitas</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF0F3;--p:#FF758F;--card:#FFE9EE;--blue:#4DA6DE;--ink:#2B2024;--mut:#7a6a70}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;background:#FFE4EA;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;z-index:5}
h1{margin:0;font-size:22px;color:var(--p);display:flex;align-items:center;gap:8px}
.lg{width:34px;height:34px;border-radius:50%;object-fit:cover;box-shadow:0 2px 6px #ff758f55}
.wrap{padding:12px 16px;max-width:560px;margin:auto}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--ink);border-radius:24px;padding:12px 16px;margin-bottom:12px}
.search input{border:0;outline:0;flex:1;font:inherit;font-size:16px;background:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{white-space:nowrap;border:1.5px solid var(--ink);background:#fff;border-radius:20px;padding:7px 14px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.card{background:#fff;border-radius:24px;box-shadow:0 4px 14px #ff758f33;margin:14px 0;overflow:hidden;position:relative;cursor:pointer}
.card img{width:100%;height:190px;object-fit:cover;display:block}
.card .b{padding:16px 20px}.card h3{margin:0 0 12px;font-size:18px}
.card.noimg h3{padding-right:110px;min-height:24px}
.badge{position:absolute;top:12px;right:12px;left:auto;z-index:2;background:#FFA62B;color:#fff;border-radius:14px;padding:5px 12px;font-size:13px;font-weight:500}
.tag{display:inline-block;background:#d9f4f1;color:#1f9d92;border-radius:14px;padding:5px 12px;font-size:13px;font-weight:500}
.row{display:flex;justify-content:space-between;align-items:center}
.ib{background:none;border:0;font-size:20px;cursor:pointer;color:var(--p)}
.fab{position:fixed;right:16px;bottom:100px;background:var(--p);color:#fff;border:0;border-radius:28px;padding:16px 24px;font:inherit;font-weight:600;font-size:15px;box-shadow:0 6px 16px #ff758f66;z-index:6}
nav{position:fixed;bottom:0;left:0;right:0;background:#FFE4EA;display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:7}
nav button{border:0;background:none;font:inherit;font-size:12px;font-weight:500;padding:8px 22px;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--ink)}
nav button span{font-size:22px}nav button.on{background:#ffc9d4}
.panel{background:var(--card);border-radius:28px;padding:20px;margin:16px 0;box-shadow:0 4px 14px #ff758f22}
.panel h2{margin:0 0 6px;font-size:19px;color:var(--p)}.panel p{margin:0 0 14px;color:var(--mut);font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.stat{border-radius:18px;padding:14px;font-size:14px}.stat b{display:block;font-size:24px}
.btn{width:100%;border:0;border-radius:22px;padding:14px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;margin:5px 0;background:var(--p);color:#fff}
.btn.o{background:none;border:1.5px solid var(--ink);color:var(--p)}.btn.b{background:var(--blue)}
.ov{position:fixed;inset:0;background:#0006;z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:auto}
.sheet h2{margin:0 0 12px;color:var(--p)}
input,select,textarea{width:100%;font:inherit;font-size:15px;border:1.5px solid #f3b6c3;border-radius:16px;padding:11px 14px;margin:5px 0 8px;background:#fff;outline:0}
label{font-size:13px;font-weight:500;color:var(--mut)}
.det img{width:100%;border-radius:20px;max-height:220px;object-fit:cover}
.det li{margin:6px 0;line-height:1.4}.det ol li{margin-bottom:10px}
.lst label{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:12px 14px;margin:8px 0;font-size:15px;color:var(--ink)}
.lst input{width:20px;height:20px;margin:0;accent-color:var(--p)}.done{text-decoration:line-through;opacity:.5}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
</style></head><body>
<header><h1 id="ttl"></h1></header><div class="wrap" id="app"></div><div id="fabw"></div>
<nav id="nav"></nav><div id="modal"></div>
<script>
const KR='caderno_rec',KL='caderno_lista';
const ld=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}};
let R=ld(KR),L=ld(KL),view='rec',q='',cat='Todas',dif='Todos';
const sv=()=>{try{localStorage.setItem(KR,JSON.stringify(R));localStorage.setItem(KL,JSON.stringify(L))}catch(e){alert('⚠️ Não consegui salvar: o armazenamento do aparelho está cheio. Faça um backup e remova fotos grandes.')}};
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=['Doces','Salgados','Bebidas','Outros'],DIFS=['Fácil','Médio','Difícil'];
const DI={'Fácil':'⭐','Médio':'⭐⭐','Difícil':'⭐⭐⭐'},CI={Doces:'🍰',Salgados:'🥐',Bebidas:'🥤',Outros:'🍽️'};
const $=s=>document.querySelector(s);
const allCats=()=>{const o=[...CATS];R.forEach(r=>{if(r.cat&&!o.includes(r.cat))o.push(r.cat)});return o};

function render(){
 $('#ttl').innerHTML={rec:'Caderno de Receitas <img class="lg" src="icon-192.png" alt="">',lista:'Lista de Compras 🛒',nuvem:'Backup 📦'}[view];
 $('#nav').innerHTML=[['rec','📖','Receitas 💖'],['lista','🛒','Lista 🛒'],['nuvem','☁️','Backup 📦']].map(([k,i,t])=>`<button class="${view==k?'on':''}" onclick="view='${k}';render()"><span>${i}</span>${t}</button>`).join('');
 $('#fabw').innerHTML=view=='rec'?'<button class="fab" onclick="openForm()">＋ Nova Receita 💖</button>':'';
 $('#app').innerHTML={rec:vRec,lista:vLista,nuvem:vBackup}[view]();
}
function vRec(){
 if(cat!='Todas'&&!allCats().includes(cat))cat='Todas';
 const f=R.filter(r=>(cat=='Todas'||r.cat==cat)&&(dif=='Todos'||r.dif==dif)&&(r.title+' '+r.ing.join(' ')).toLowerCase().includes(q.toLowerCase()));
 const ch=(a,cur,set)=>`<div class="chips">${a.map(x=>`<button class="chip ${cur==x?'on':''}" onclick="${set}='${x}';render()">${CI[x]||DI[x]||(x=='Todas'||x=='Todos'?'✓':'🏷️')} ${x}</button>`).join('')}</div>`;
 return `<div class="search">🔍<input id="q" placeholder="Buscar receitas ou ingredientes..." value="${E(q)}" oninput="q=this.value;lst()"></div>
 ${ch(['Todas',...allCats()],cat,'cat')}${ch(['Todos',...DIFS],dif,'dif')}<div id="cards">${cards(f)}</div>`;
}
const lst=()=>{const f=R.filter(r=>(cat=='Todas'||r.cat==cat)&&(dif=='Todos'||r.dif==dif)&&(r.title+' '+r.ing.join(' ')).toLowerCase().includes(q.toLowerCase()));$('#cards').innerHTML=cards(f)};
function cards(f){return f.length?f.map(r=>`<div class="card${r.img?'':' noimg'}" onclick="det('${r.id}')">${r.img?`<img src="${E(r.img)}" loading="lazy" onerror="this.remove()">`:''}<span class="badge">${CI[r.cat]||'🏷️'} ${r.cat}</span><div class="b"><h3>${E(r.title)}</h3><div class="row"><span class="tag">${DI[r.dif]} ${r.dif}</span><button class="ib" onclick="event.stopPropagation();pr('${r.id}')">🖨️</button></div></div></div>`).join(''):'<div class="empty">Nenhuma receita ainda.<br>Toque em “Nova Receita” 💖</div>'}

function det(id){const r=R.find(x=>x.id==id);if(!r)return;
 modal(`<div class="det"><h2>${E(r.title)}</h2>${r.img?`<img src="${E(r.img)}" onerror="this.remove()">`:''}
 <p><span class="tag">${DI[r.dif]} ${r.dif}</span> <span class="tag" style="background:#ffe0a8;color:#a86400">${CI[r.cat]||'🏷️'} ${r.cat}</span>${r.time?` <span class="tag" style="background:#e6e6f7;color:#555">⏱ ${E(r.time)}</span>`:''}${r.yield?` <span class="tag" style="background:#e6e6f7;color:#555">🍽 ${E(r.yield)}</span>`:''}</p>
 <h3>Ingredientes</h3><ul>${r.ing.map(i=>`<li>${E(i)}</li>`).join('')}</ul><h3>Modo de preparo</h3><ol>${r.steps.map(i=>`<li>${E(i)}</li>`).join('')}</ol>
 ${r.src?`<p><a href="${E(r.src)}" target="_blank" rel="noopener" style="color:var(--blue)">🔗 Ver receita original</a></p>`:''}
 <button class="btn" onclick="toList('${r.id}')">🛒 Adicionar à lista de compras</button>
 <button class="btn o" onclick="pr('${r.id}')">🖨️ Imprimir</button><button class="btn o" onclick="openForm('${r.id}')">✏️ Editar</button>
 <button class="btn o" style="color:#c0392b" onclick="del('${r.id}')">🗑️ Excluir</button><button class="btn o" onclick="closeM()">Fechar</button></div>`)}
const modal=h=>{$('#modal').innerHTML=`<div class="ov" onclick="if(event.target==this)closeM()"><div class="sheet">${h}</div></div>`};
const closeM=()=>$('#modal').innerHTML='';
function del(id){if(confirm('Excluir esta receita?')){R=R.filter(r=>r.id!=id);sv();closeM();render()}}
function toList(id){const r=R.find(x=>x.id==id);r.ing.forEach(i=>L.push({t:i,d:0,from:r.title}));sv();closeM();view='lista';render()}
function pr(id){const r=R.find(x=>x.id==id),w=window.open('','_blank');if(!w)return alert('Permita pop-ups para imprimir.');
 w.document.write(`<title>${E(r.title)}</title><body style="font-family:sans-serif;max-width:700px;margin:auto;padding:20px"><h1>${E(r.title)}</h1><p>${r.cat} · ${r.dif} ${r.time?'· '+E(r.time):''}</p><h3>Ingredientes</h3><ul>${r.ing.map(i=>`<li>${E(i)}</li>`).join('')}</ul><h3>Modo de preparo</h3><ol>${r.steps.map(i=>`<li>${E(i)}</li>`).join('')}</ol>${r.src?`<p><small>${E(r.src)}</small></p>`:''}`);w.document.close();w.print()}

let draft={};
function openForm(id){draft=id?{...R.find(x=>x.id==id)}:{id:'',title:'',cat:'Salgados',dif:'Fácil',img:'',ing:[],steps:[],src:'',time:'',yield:''};
 modal(`<h2>${id?'Editar':'Nova'} receita 💖</h2>
 ${id?'':`<div class="panel" style="margin-top:0"><label>🔗 Colar link da receita (importa tudo sozinho)</label><input id="f_url" type="url" placeholder="https://..." inputmode="url"><button class="btn b" id="imp" onclick="imp()">✨ Importar do link</button><small id="msg" style="color:var(--mut)"></small><details style="margin-top:10px"><summary style="cursor:pointer;font-size:14px;color:var(--p)">📝 Ou cole o texto da receita</summary><textarea id="f_txt" rows="5" placeholder="Copie a receita do site e cole aqui (com os títulos Ingredientes e Modo de preparo)"></textarea><button class="btn o" onclick="impTxt()">Organizar texto</button></details></div><p style="text-align:center;color:var(--mut)">— ou escreva manualmente —</p>`}
 <div id="fields">${fields()}</div><button class="btn" onclick="saveR()">💾 Salvar receita</button><button class="btn o" onclick="closeM()">Cancelar</button>`);prev()}
const opt=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
function fields(){const d=draft;return `<label>Nome</label><input id="f_t" value="${E(d.title)}">
 <label>Categoria</label><select id="f_c">${opt(allCats(),d.cat)}</select><input id="f_nc" placeholder="➕ Ou crie uma nova categoria (ex: Massas)" maxlength="25"><label>Dificuldade</label><select id="f_d">${opt(DIFS,d.dif)}</select>
 <label>Foto (opcional)</label><div id="f_prev"></div>
 <div style="display:flex;gap:8px"><button type="button" class="btn b" style="margin:5px 0" onclick="$('#f_file').click()">📷 Escolher / tirar foto</button><button type="button" class="btn o" style="margin:5px 0;width:auto;padding:0 16px" onclick="rmImg()">✕</button></div>
 <input type="file" id="f_file" accept="image/*" style="display:none" onchange="readImg(this)">
 <input id="f_i" placeholder="…ou cole o link de uma foto" value="${E(String(d.img||'').startsWith('data:')?'':d.img)}" oninput="draft.img=this.value.trim();prev()"><label>Tempo (ex: 45 min)</label><input id="f_tm" value="${E(d.time)}">
 <label>Rendimento (ex: 8 porções)</label><input id="f_y" value="${E(d.yield)}">
 <label>Ingredientes (um por linha)</label><textarea id="f_ing" rows="6">${E(d.ing.join('\n'))}</textarea>
 <label>Modo de preparo (um passo por linha)</label><textarea id="f_s" rows="6">${E(d.steps.join('\n'))}</textarea>`}
function newCat(){const n=g0('f_nc');if(!n)return g0('f_c');return allCats().find(c=>c.toLowerCase()==n.toLowerCase())||n}
const g0=i=>$('#'+i).value.trim();
function prev(){const p=$('#f_prev');if(p)p.innerHTML=draft.img?`<img src="${E(draft.img)}" style="width:100%;max-height:180px;object-fit:cover;border-radius:16px;margin:4px 0" onerror="this.remove()">`:''}
function rmImg(){draft.img='';$('#f_i').value='';prev()}
function readImg(inp){const f=inp.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);
 im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);draft.img=c.toDataURL('image/jpeg',.75);URL.revokeObjectURL(u);$('#f_i').value='';prev()};
 im.onerror=()=>alert('Não consegui abrir essa imagem. Tente outra foto.');im.src=u;inp.value=''}
function saveR(){const g=i=>$('#'+i).value.trim(),sp=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);
 if(!g('f_t'))return alert('Dê um nome para a receita.');
 const r={...draft,title:g('f_t'),cat:newCat(),dif:g('f_d'),img:g('f_i')||(String(draft.img||'').startsWith('data:')?draft.img:''),time:g('f_tm'),yield:g('f_y'),ing:sp($('#f_ing').value),steps:sp($('#f_s').value)};
 if(r.id)R=R.map(x=>x.id==r.id?r:x);else{r.id=Date.now().toString(36);R.unshift(r)}sv();closeM();view='rec';render()}

const PX=[
 u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
 u=>'https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(u),
 u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
 u=>'https://thingproxy.freeboard.io/fetch/'+u,
 u=>'https://r.jina.ai/'+u];
const tryP=(i,u)=>new Promise(async(ok,no)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);
 try{const r=await fetch(PX[i](u),{signal:c.signal,headers:i==4?{'X-Return-Format':'html'}:{}});const x=await r.text();clearTimeout(t);/<html|<body|<script/i.test(x)&&x.length>800?ok(x):no(0)}catch(e){no(e)}});
const getHTML=u=>Promise.any(PX.map((_,i)=>tryP(i,u)));
const txt=h=>new DOMParser().parseFromString(String(h??''),'text/html').body.textContent.replace(/\s+/g,' ').trim();
const cl=s=>s.replace(/^[-•*·]+\s*/,'').replace(/^\d+[.)]\s+/,'').trim();
const t2=e=>cl(e.textContent.replace(/\s+/g,' ').trim());
function findRecipe(doc){for(const s of doc.querySelectorAll('script[type="application/ld+json"]')){try{const stack=[JSON.parse(s.textContent)];while(stack.length){const n=stack.pop();if(!n||typeof n!='object')continue;if(Array.isArray(n)){stack.push(...n);continue}const t=[].concat(n['@type']||[]);if(t.includes('Recipe'))return n;if(n['@graph'])stack.push(...n['@graph'])}}catch(e){}}}
function steps(x){if(!x)return[];if(typeof x=='string')return x.split(/\n+/).map(txt).filter(Boolean);return[].concat(x).flatMap(s=>typeof s=='string'?[txt(s)]:s.itemListElement?steps(s.itemListElement):s.text?[txt(s.text)]:[])}
function dur(s){const m=/PT(?:(\d+)H)?(?:(\d+)M)?/.exec(s||'');if(!m)return'';const h=+m[1]||0,mi=+m[2]||0;return(h?h+' h ':'')+(mi?mi+' min':'')}
function fromDoc(doc){
 const o={title:'',img:'',time:'',yield:'',ing:[],steps:[],kw:''},r=findRecipe(doc),mt=n=>doc.querySelector(`meta[property="${n}"],meta[name="${n}"]`)?.content||'';
 if(r){let im=r.image;im=Array.isArray(im)?im[0]:im;im=typeof im=='object'?im?.url:im;
  Object.assign(o,{title:txt(r.name||''),img:im||'',ing:[].concat(r.recipeIngredient||r.ingredients||[]).map(txt).filter(Boolean),steps:steps(r.recipeInstructions),time:dur(r.totalTime||r.cookTime),yield:String([].concat(r.recipeYield||[])[0]||''),kw:String(r.recipeCategory||'')+' '+String(r.keywords||'')})}
 if(!o.title)o.title=txt(mt('og:title')||doc.title).split(/\s[|–—-]\s/)[0];
 if(!o.img)o.img=mt('og:image');
 if(!o.ing.length)o.ing=[...doc.querySelectorAll('[itemprop=recipeIngredient],[itemprop=ingredients]')].map(t2).filter(Boolean);
 if(!o.steps.length){const e=doc.querySelector('[itemprop=recipeInstructions]');if(e){const li=[...e.querySelectorAll('li,p')];o.steps=li.length?li.map(t2).filter(Boolean):e.textContent.split('\n').map(x=>cl(x.trim())).filter(Boolean)}}
 if(!o.ing.length||!o.steps.length){const hs=[...doc.querySelectorAll('h1,h2,h3,h4,h5,strong,b')];
  const after=re=>{const h=hs.find(x=>x.textContent.trim().length<40&&re.test(x.textContent.trim()));if(!h)return[];let n=(h.closest('h1,h2,h3,h4,h5,p,div')||h).nextElementSibling,out=[];
   for(let i=0;n&&i<6;i++,n=n.nextElementSibling){if(/^H[1-5]$/.test(n.tagName)&&out.length)break;const li=[...n.querySelectorAll('li')];if(li.length)out.push(...li.map(t2));else if(n.tagName=='P'||n.tagName=='LI')out.push(t2(n))}return out.filter(Boolean)};
  if(!o.ing.length)o.ing=after(/^ingredientes?/i);if(!o.steps.length)o.steps=after(/^(modo de preparo|preparo|modo de fazer|instru)/i)}
 return o}
function apply(o,u,m){const n=o.steps.length,t=(o.title+' '+o.kw).toLowerCase();
 o.dif=n<=5?'Fácil':n<=9?'Médio':'Difícil';
 o.cat=/doce|sobremesa|bolo|brigadeiro|pudim|biscoito|cookie|chocolate|mousse|dessert|cake|sorvete|pave|pavê/.test(t)?'Doces':/suco|bebida|drink|vitamina|smoothie|caipirinha/.test(t)?'Bebidas':'Salgados';delete o.kw;
 for(const k in o)if(o[k]&&(!Array.isArray(o[k])||o[k].length))draft[k]=o[k];if(u)draft.src=u;
 $('#fields').innerHTML=fields();prev();
 m.textContent=draft.ing.length&&draft.steps.length?'✅ Pronto! Confira os dados e toque em Salvar.':'⚠️ Consegui só parte dos dados. Complete o que faltar abaixo e salve.'}
async function imp(){const u=$('#f_url').value.trim(),m=$('#msg'),b=$('#imp');if(!/^https?:\/\//.test(u))return m.textContent='Cole um link válido começando com http.';
 b.disabled=true;m.textContent='Buscando receita… ⏳ (pode levar até 15 s)';let h;
 try{h=await getHTML(u)}catch(e){draft.src=u;m.textContent='😕 Não consegui abrir esse site pelos serviços gratuitos de leitura (podem estar fora do ar ou bloqueando o site). Tente de novo daqui a pouco ou cole o texto da receita na caixa abaixo. O link fica salvo.';b.disabled=false;return}
 try{apply(fromDoc(new DOMParser().parseFromString(h,'text/html')),u,m)}catch(e){draft.src=u;m.textContent='😕 Abri o site, mas não entendi a página. Cole o texto da receita abaixo ou preencha manualmente.'}
 b.disabled=false}
function impTxt(){const m=$('#msg'),t=$('#f_txt').value;if(t.trim().length<20)return m.textContent='Cole o texto da receita na caixa.';
 const L=t.split('\n').map(cl).filter(Boolean),ix=L.findIndex(x=>/^ingredientes?\s*:?$/i.test(x)),px=L.findIndex(x=>/^(modo de (preparo|fazer)|preparo|instru[çc][õo]es)\s*:?$/i.test(x)),o={title:'',ing:[],steps:[],kw:''};
 if(ix>=0&&px>ix){o.ing=L.slice(ix+1,px);o.steps=L.slice(px+1);if(ix>0)o.title=L[0]}
 else if(ix>=0&&px>=0){o.steps=L.slice(px+1,ix);o.ing=L.slice(ix+1);if(px>0)o.title=L[0]}
 else if(ix>=0){o.ing=L.slice(ix+1);if(ix>0)o.title=L[0]}
 else{o.title=L[0];o.steps=L.slice(1)}
 apply(o,'',m)}

function addMan(){const i=$('#nl'),v=i.value.trim();if(!v)return;L.push({t:v,d:0});sv();render()}
function pickRec(){if(!R.length)return alert('Você ainda não tem receitas salvas.');
 modal(`<h2>Escolher receitas 📖</h2><p style="color:var(--mut);margin-top:0">Marque uma ou mais receitas para adicionar os ingredientes à lista.</p><div class="lst">${R.map(r=>`<label><input type="checkbox" class="pk" value="${E(r.id)}"><span style="flex:1">${E(r.title)}<br><small style="color:var(--mut)">${r.ing.length} ingredientes</small></span></label>`).join('')}</div>
 <button class="btn" onclick="addPicked()">Adicionar à lista 🛒</button><button class="btn o" onclick="closeM()">Cancelar</button>`)}
function addPicked(){const ids=[...document.querySelectorAll('.pk:checked')].map(x=>x.value);if(!ids.length)return alert('Marque pelo menos uma receita.');
 ids.forEach(id=>{const r=R.find(x=>x.id==id);if(r)r.ing.forEach(i=>L.push({t:i,d:0,from:r.title}))});sv();closeM();view='lista';render()}
function vLista(){return `<div class="lst">${L.length?L.map((x,i)=>`<label><input type="checkbox" ${x.d?'checked':''} onchange="L[${i}].d=this.checked;sv();render()"><span class="${x.d?'done':''}" style="flex:1">${E(x.t)}<br><small style="color:var(--mut)">${E(x.from||'')}</small></span><button class="ib" onclick="event.preventDefault();L.splice(${i},1);sv();render()">✕</button></label>`).join(''):'<div class="empty">Sua lista está vazia.<br>Abra uma receita e toque em “Adicionar à lista” 🛒</div>'}</div>
 <div style="display:flex;gap:8px;margin-top:10px"><input id="nl" style="flex:1;margin:0" placeholder="Adicionar item manualmente…" onkeydown="if(event.key=='Enter')addMan()"><button class="btn" style="width:auto;margin:0;padding:0 20px" onclick="addMan()">＋</button></div>
 <button class="btn b" onclick="pickRec()">📖 Adicionar ingredientes de uma receita</button>
 ${L.some(x=>x.d)?'<button class="btn o" onclick="L=L.filter(x=>!x.d);sv();render()">Limpar itens marcados</button>':''}`}
function vBackup(){return `<div class="panel"><h2 style="color:var(--ink)">Status de Salvamento</h2><p>${R.length} receitas salvas neste aparelho</p>
 <div class="stats"><div class="stat" style="background:#ECE6F2;color:var(--blue)">📱 Neste app<b>${R.length}</b></div><div class="stat" style="background:#FFD9E0;color:var(--p)">🛒 Na lista<b>${L.length}</b></div></div></div>
 <div class="panel"><h2>📦 Exportar / Importar Backup</h2><p>Guarde uma cópia das suas receitas ou transfira para outro celular.</p>
 <button class="btn" onclick="bk('copy')">📋 Copiar backup (JSON)</button><button class="btn" style="background:var(--blue)" onclick="bk('file')">⬇️ Baixar arquivo de backup</button>
 <button class="btn" style="background:#7c6cf0" onclick="bk('cloud')">☁️ Enviar para a nuvem (Drive, WhatsApp…)</button>
 <button class="btn o" onclick="$('#impf').click()">📂 Importar arquivo de backup</button>
 <button class="btn o" onclick="rs()">📥 Restaurar backup do texto</button>
 <input type="file" id="impf" accept=".json,application/json" style="display:none" onchange="impFile(this)">
 <small style="color:var(--mut);display:block;margin-top:8px">Dica: em “Enviar para a nuvem” escolha Google Drive (ou e-mail/WhatsApp). Para restaurar, toque em “Importar arquivo” e selecione o caderno-backup.json.</small></div>`}
async function bk(m){const j=JSON.stringify({receitas:R,lista:L});
 if(m=='copy'){try{await navigator.clipboard.writeText(j);alert('Backup copiado! Cole em um bloco de notas ou mensagem.')}catch(e){prompt('Copie o texto:',j)}}
 else{const f=new File([j],'caderno-backup.json',{type:'application/json'});
  if(m=='cloud'&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Backup Caderno de Receitas'});return}catch(e){if(e.name=='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download='caderno-backup.json';a.click();
  if(m=='cloud')alert('Seu navegador não abriu o menu de compartilhar. O arquivo foi baixado: envie-o para o Google Drive manualmente.')}}
function impFile(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.receitas))throw 0;const ids=new Set(R.map(r=>r.id));R=[...d.receitas.filter(r=>!ids.has(r.id)),...R];L=[...L,...(d.lista||[])];sv();view='rec';render();alert('Backup importado! 💖')}catch(e){alert('Arquivo de backup inválido.')}});i.value=''}
function rs(){modal(`<h2>Restaurar backup 📥</h2><textarea id="rt" rows="8" placeholder="Cole aqui o texto do backup"></textarea><input type="file" id="rf" accept=".json" onchange="this.files[0].text().then(t=>$('#rt').value=t)">
 <button class="btn" onclick="doRs()">Restaurar</button><button class="btn o" onclick="closeM()">Cancelar</button>`)}
function doRs(){try{const d=JSON.parse($('#rt').value);if(!Array.isArray(d.receitas))throw 0;const ids=new Set(R.map(r=>r.id));R=[...d.receitas.filter(r=>!ids.has(r.id)),...R];L=[...L,...(d.lista||[])];sv();closeM();view='rec';render();alert('Backup restaurado! 💖')}catch(e){alert('Texto de backup inválido.')}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
